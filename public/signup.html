<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign up - Elsemail</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="nav"><b><a href="/" style="color:#fff">Elsemail</a></b></div>
<div class="wrap"><div class="card" style="max-width:420px;margin:40px auto">
<h2>Sign up</h2><div id="msg"></div>
<label>Email</label><input id="email" type="email" placeholder="tumi@mail.com">
<label>Password (min 6)</label><input id="pass" type="password" placeholder="******">
<button class="btn" onclick="go()">Create account</button>
<p class="mut">Ache? <a href="/login">Login</a></p></div></div>
<script>
async function go(){
 const r=await fetch('/api/account/register',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({email:email.value,password:pass.value})});
 const d=await r.json();
 if(d.ok) location.href='/console'; else msg.innerHTML='<p class=err>'+d.error+'</p>';
}
</script></body></html>
