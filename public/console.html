<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Console - Elsemail</title><link rel="stylesheet" href="/styles.css"></head><body>
<div class="nav"><b><a href="/" style="color:#fff">Elsemail</a></b><span>Console</span><span class="sp"></span>
<span id="who" class="mut"></span><a href="/docs">Docs</a><a href="#" onclick="logout()">Logout</a></div>
<div class="wrap">
<div class="card"><h3>Status</h3><div id="status" class="mut">loading...</div></div>
<div class="grid">
<div class="card"><h3>Send mail</h3><div id="m1"></div>
<input id="to" placeholder="to@mail.com"><input id="subj" placeholder="Subject">
<textarea id="body" rows="3" placeholder="Message"></textarea>
<button class="btn" onclick="sendMail()">Send</button></div>
<div class="card"><h3>OTP test</h3><div id="m2"></div>
<input id="otpEmail" placeholder="email"><div class="row">
<button class="btn" onclick="sendOtp()">Send OTP</button></div>
<input id="otpCode" placeholder="code"><button class="btn ghost" onclick="verifyOtp()">Verify</button></div>
</div>
<div class="card"><h3>Password reset test</h3><div id="m3"></div>
<input id="rsEmail" placeholder="email">
<button class="btn" onclick="reqReset()">Send reset link</button></div>
<div class="card"><h3>Inbox (local provider)</h3><button class="btn ghost" onclick="loadInbox()">Refresh</button><div id="inbox"></div></div>
</div>
<script src="/app.js"></script></body></html>
